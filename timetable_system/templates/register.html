<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBuse Course Timetable - Register</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">MB</div>
            <h1>Create {{ role_label }} Account</h1>
            <p class="subtitle">MyBuse Course Timetable</p>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <input type="hidden" name="role" value="{{ role }}">
                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Choose a password">
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg">Create {{ role_label }} Account</button>
            </form>
            <p style="text-align:center; margin-top: 16px;">
                Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
            </p>
        </div>
    </div>
</body>
</html>
